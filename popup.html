<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simplexity</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <img class="brand__logo" src="assets/logo.png" alt="" />
        <div class="brand__name">
          <span class="brand__title">Simplexity</span>
        </div>
      </div>
      <div class="topbar__actions">
        <button id="history-open" class="icon-btn" type="button" aria-label="Chat history" title="History" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/>
            <path d="M3 4v4.5h4.5"/>
            <path d="M12 7.5V12l3 2"/>
          </svg>
        </button>
        <button id="settings-open" class="icon-btn" type="button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="1.9"/>
            <circle cx="12" cy="12" r="1.9"/>
            <circle cx="19" cy="12" r="1.9"/>
          </svg>
        </button>
      </div>
      <div id="toasts" class="toasts" aria-live="polite"></div>
    </header>

    <div class="divider"></div>

    <div class="model-row">
      <div class="model-picker">
        <button id="model" class="model-pill" type="button" role="combobox" aria-label="Model" aria-haspopup="listbox" aria-expanded="false" aria-controls="model-menu" disabled>
          <img id="model-icon" class="model-pill__brand" src="" alt="" hidden />
          <span id="model-label" class="model-pill__label">Choose your model...</span>
          <span id="model-size" class="badge" hidden></span>
          <svg class="model-pill__chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>
        <div id="model-menu" class="model-menu" role="listbox" aria-label="Choose a model" tabindex="-1" hidden></div>
      </div>
      <div class="conn-group">
        <div id="status" class="conn conn--disconnected" role="status" aria-live="polite">
          <svg class="conn__link" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.5 17H7.5a5 5 0 0 1 0-10h2"/>
            <path d="M14.5 7h2a5 5 0 0 1 0 10h-2"/>
            <path d="M8.5 12h7"/>
          </svg>
          <span id="status-text" class="conn__text">Not connected</span>
        </div>
        <button id="refresh-btn" class="refresh-btn" type="button" aria-label="Refresh connection" title="Reconnect and reload models">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
            <path d="M20 4v5h-5"/>
          </svg>
        </button>
      </div>
    </div>
    <main id="stage" class="stage">
      <section id="hero" class="hero">
        <div class="welcome-art-halo">
          <img id="hero-emoji" class="hero__emoji" src="assets/mascot.png" alt="" />
        </div>
        <h2 id="greeting" class="hero__greeting">Let's search it up!</h2>
      </section>
      <section id="messages" class="messages" aria-live="polite" hidden></section>
    </main>
    <div id="chips" class="chips" role="group" aria-label="Quick prompts">
      <button class="chip" type="button" data-prompt="Summarize the key points of this page.">
        <img class="chip__emoji" src="assets/emoji/summarize.png" alt="" />
        Summarize
      </button>
      <button class="chip" type="button" data-prompt="Explain the main ideas of this page in simple terms.">
        <img class="chip__emoji" src="assets/emoji/explain.png" alt="" />
        Explain
      </button>
      <button class="chip" type="button" data-prompt="Translate this page into English.">
        <img class="chip__emoji" src="assets/emoji/translate.png" alt="" />
        Translate
      </button>
    </div>

    <div id="attachments" class="attachments" hidden></div>
    <form id="prompt-form" class="composer">
      <button id="plus-btn" class="plus-btn" type="button" aria-label="Add a screenshot" aria-haspopup="true" aria-expanded="false" title="Add">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <div id="plus-menu" class="plus-menu" role="menu" hidden>
        <button id="shot-btn" class="plus-menu__item" type="button" role="menuitem">
          <img class="plus-menu__icon" src="assets/camera.png" alt="" aria-hidden="true" width="15" height="15" />
          <span>Make a screenshot</span>
        </button>
      </div>
      <textarea id="prompt" rows="3" placeholder="Ask anything" aria-label="Your prompt"></textarea>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </form>
  <div id="settings-overlay" class="sheet-overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <img class="settings-deco" src="assets/deco/mac.png" alt="" aria-hidden="true" />
      <div class="sheet-head">
        <h2 id="settings-title" class="sheet-title">Settings &#128639;</h2>
        <button id="settings-close" class="icon-btn icon-btn--ghost" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="sheet-body">
        <p class="settings-sub">Set up your environment.</p>
        <div class="field-row">
          <label class="field field--grow">
            <span>Host</span>
            <input id="host" type="text" value="127.0.0.1" spellcheck="false" autocomplete="off" />
          </label>
          <label class="field field--port">
            <span>Port</span>
            <input id="port" type="number" min="1" max="65535" value="1234" />
          </label>
        </div>
        <label class="field">
          <span>Temperature <output id="temp-out">0.70</output></span>
          <input id="temperature" type="range" min="0" max="2" step="0.05" value="0.7" />
        </label>
        <label class="field">
          <span>Max tokens</span>
          <input id="max-tokens" type="number" min="1" max="8192" value="1024" />
        </label>
        <p id="settings-msg" class="settings-msg" role="status"></p>
      </div>
      <div class="sheet-foot settings-actions">
        <button id="test-btn" class="btn btn--ghost" type="button">Test connection</button>
        <button id="done-btn" class="btn btn--primary" type="button">Done</button>
      </div>
    </section>
  </div>
  </div>
  <div id="history-overlay" class="sheet-overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <div class="sheet-head">
        <h2 id="history-title" class="sheet-title">History</h2>
        <button id="history-new" class="btn btn--primary history-new" type="button">New chat</button>
        <button id="history-close" class="icon-btn icon-btn--ghost" type="button" aria-label="Close history">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <ul id="history-list" class="history-list"></ul>
      <div class="sheet-foot history-foot" hidden>
        <button id="history-clear" class="history-clear" type="button">Clear all history</button>
      </div>
    </section>
  </div>
  <script src="notify.js"></script>
  <script src="history.js"></script>
  <script src="attach.js"></script>
  <script src="popup.js"></script>
</body>
</html>
